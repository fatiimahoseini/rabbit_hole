services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./apps/api/data:/app/apps/api/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - '5173:80'
    depends_on:
      - api
    restart: unless-stopped
